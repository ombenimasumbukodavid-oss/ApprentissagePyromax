name: Construire Apprentissage Pyromax

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Générer APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Compiler avec Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: .
          buildozer_version: stable

      - name: Télécharger le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Apprentissage-Pyromax-APK
          path: ${{ steps.buildozer.outputs.filename }}
